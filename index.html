<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Book Cricket</title>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1e7;--card:#fffaf0;--ink:#2b2118;--mut:#7a6a58;--acc:#c0392b;--grn:#2e8b57;--gold:#d99a1e;--pg:#fffdf6;--line:#e3d8c3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17130f;--card:#241d16;--ink:#f3e9d8;--mut:#a89a86;--acc:#ff6b5a;--grn:#4cc58a;--gold:#f0b53c;--pg:#f4ead3;--line:#3a3023;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17130f;--card:#241d16;--ink:#f3e9d8;--mut:#a89a86;--acc:#ff6b5a;--grn:#4cc58a;--gold:#f0b53c;--pg:#f4ead3;--line:#3a3023;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;min-height:100vh}
main{max-width:760px;margin:0 auto;padding:18px 14px 40px}
h1{margin:6px 0 2px;font-size:2rem;text-align:center;letter-spacing:.5px}
.sub{text-align:center;color:var(--mut);margin:0 0 16px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
label{display:block;font-size:.85rem;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:1rem}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:13px 20px;background:var(--acc);color:#fff;font-weight:700;font-size:1.05rem;transition:transform .12s,opacity .2s}
button:active{transform:scale(.96)}button:disabled{opacity:.5;cursor:default}
.big{width:100%;margin-top:16px}
.hide{display:none!important}
.score{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pl{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px;text-align:center;transition:.3s}
.pl.on{border-color:var(--gold);box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 25%,transparent);transform:translateY(-2px)}
.pl b{display:block;font-size:.95rem}.pl .t{font-size:2.3rem;font-weight:700;line-height:1.1}.pl small{color:var(--mut);display:block;min-height:1.1em}
.status{text-align:center;margin:14px 0 4px;color:var(--mut);min-height:1.4em}
.stage{perspective:1100px;display:flex;justify-content:center;margin:10px 0}
.book{position:relative;width:min(92%,420px);height:230px;display:flex;filter:drop-shadow(0 12px 14px rgba(0,0,0,.28))}
.pgL,.pgR{flex:1;background:var(--pg);border:1px solid #cdbf9f;position:relative;display:flex;align-items:center;justify-content:center;color:#3a2e20}
.pgL{border-radius:10px 0 0 10px;background-image:repeating-linear-gradient(#0000 0 21px,#d9cdb2 21px 22px);box-shadow:inset -14px 0 18px -10px rgba(0,0,0,.25)}
.pgR{border-radius:0 10px 10px 0;box-shadow:inset 14px 0 18px -10px rgba(0,0,0,.25)}
.pgR .num{font-size:4.4rem;font-weight:700;font-variant-numeric:tabular-nums}
.pgL .txt{font-size:.8rem;color:#8a7a60;text-align:center;padding:0 14px;font-style:italic}
.flip{position:absolute;left:50%;top:0;width:50%;height:100%;background:var(--pg);border:1px solid #cdbf9f;border-radius:0 10px 10px 0;transform-origin:left center;backface-visibility:hidden;opacity:0}
.rolling .flip{opacity:1;animation:fl .28s linear infinite}
@keyframes fl{0%{transform:rotateY(0)}100%{transform:rotateY(-178deg);background:#efe5cc}}
.spine{position:absolute;left:50%;top:-3px;bottom:-3px;width:5px;margin-left:-2px;background:linear-gradient(#6b3b1d,#4a2812);border-radius:2px;z-index:2}
.res{position:absolute;inset:auto 0 -2px 0;text-align:center;font-weight:800;font-size:1.1rem;pointer-events:none}
#result{text-align:center;font-size:2.4rem;font-weight:800;height:3.2rem;margin:6px 0 0}
.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
.shake{animation:sh .55s}
@keyframes sh{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.flash{animation:fr .7s}
@keyframes fr{0%{box-shadow:0 0 0 0 var(--acc)}100%{box-shadow:0 0 0 40px transparent}}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:36px;margin:8px 0}
.chip{min-width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--line);font-weight:700;animation:pop .35s}
.chip.f{background:#2e8b57;color:#fff;border-color:#2e8b57}.chip.s{background:var(--gold);color:#222}.chip.w{background:var(--acc);color:#fff}
table{width:100%;border-collapse:collapse;font-size:.9rem}td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
details summary{cursor:pointer;font-weight:700}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.ov .box{background:var(--card);border-radius:20px;padding:26px;text-align:center;max-width:380px;width:100%;animation:pop .5s}
.ov h2{margin:0 0 6px;font-size:1.8rem}
.p{position:fixed;pointer-events:none;font-size:1.4rem;z-index:60;animation:fly 1.1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
.hist{font-size:.78rem;color:var(--mut)}
html:root:root{--bg:#6b4423;--card:#fbf5e3;--ink:#2b2118;--mut:#6d5a45;--acc:#b3261e;--grn:#2e7d4f;--gold:#e0a21f;--pg:#fbf3da;--line:#d8c9a6;color-scheme:light}
body{font-family:'Special Elite','Courier New',monospace;background-color:#6b4423;background-attachment:fixed;background-image:radial-gradient(ellipse at 30% 0%,transparent 35%,rgba(0,0,0,.5)),repeating-linear-gradient(90deg,rgba(0,0,0,.32) 0 2px,transparent 2px 150px),repeating-linear-gradient(90deg,rgba(255,220,160,.05) 0 3px,transparent 3px 11px),repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0 1px,transparent 1px 6px),linear-gradient(180deg,#7d4f29,#573419)}
h1{font-family:'Special Elite',monospace;color:#f1f1e6;background:#1f3b2d;border:7px solid #8b5a2b;border-radius:6px;padding:10px 6px;box-shadow:0 8px 16px rgba(0,0,0,.5),inset 0 0 30px rgba(0,0,0,.5);text-shadow:0 0 6px rgba(255,255,255,.35)}
.sub{color:#f0dfbb;text-shadow:0 1px 3px #000}
.card{background-color:#fbf5e3;background-image:linear-gradient(90deg,transparent 36px,rgba(200,70,70,.55) 36px 38px,transparent 38px),repeating-linear-gradient(#0000 0 29px,rgba(70,120,170,.28) 29px 30px);padding-left:52px;box-shadow:0 8px 18px rgba(0,0,0,.45);transform:rotate(-.4deg)}
.pl{background:#1f3b2d;border:6px solid #8b5a2b;color:#f1f1e6;font-family:'Caveat','Comic Sans MS',cursive;box-shadow:inset 0 0 22px rgba(0,0,0,.5),0 6px 12px rgba(0,0,0,.4)}
.pl b{font-size:1.4rem}.pl small{color:#cfd8c6}.pl .t{font-size:3rem}
.pl.on{border-color:var(--gold)}
.status{color:#f3e3c0;text-shadow:0 1px 3px #000;font-family:'Caveat',cursive;font-size:1.35rem}
#result{--ink:#fff3d6;--grn:#8ff0b0;--acc:#ff8a7a;font-family:'Caveat',cursive;text-shadow:0 2px 6px rgba(0,0,0,.7)}
.chip{font-family:'Caveat',cursive;font-size:1.2rem;box-shadow:0 2px 4px rgba(0,0,0,.4)}
button{font-family:'Special Elite',monospace;box-shadow:0 4px 0 #7a1710,0 8px 12px rgba(0,0,0,.4)}
.stage{perspective:none}
.book{filter:none;transform-style:preserve-3d;transform:perspective(1200px) rotateX(16deg);border:9px solid #7b3f1d;border-radius:14px;background:#7b3f1d;height:245px;box-shadow:0 6px 0 #5b2f14,0 11px 0 #3e1f0c,0 26px 34px rgba(0,0,0,.65)}
.pgR{box-shadow:inset 14px 0 18px -10px rgba(0,0,0,.25),3px 3px 0 #efe6cc,6px 6px 0 #e0d4b4}
.pgR .num{font-family:'Special Elite',monospace}
.flip{display:none}
.leaf{position:absolute;left:50%;top:0;width:50%;height:100%;transform-origin:left center;transform-style:preserve-3d;z-index:3;animation:turn .62s cubic-bezier(.45,.05,.3,1) forwards;pointer-events:none}
.leaf i{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:0 10px 10px 0;background:linear-gradient(90deg,#e4d7b6,var(--pg) 35%);border:1px solid #cdbf9f;animation:shade .62s ease-in-out forwards}
.leaf i.b{transform:rotateY(180deg);border-radius:10px 0 0 10px;background:linear-gradient(270deg,#e0d3b0,#f3e8cb 45%)}
@keyframes turn{0%{transform:rotateY(0)}45%{transform:rotateY(-80deg) skewY(-2.5deg)}85%{transform:rotateY(-170deg);opacity:1}100%{transform:rotateY(-180deg);opacity:0}}
@keyframes shade{0%{filter:brightness(1)}50%{filter:brightness(.78)}100%{filter:brightness(1)}}
.desk{display:flex;justify-content:center;align-items:center;gap:26px;margin-top:22px;font-size:2.4rem;filter:drop-shadow(0 6px 5px rgba(0,0,0,.5))}
.pen{display:inline-block;transform:rotate(-22deg)}.app{display:inline-block;transform:rotate(10deg)}
.ruler{width:200px;height:30px;border-radius:3px;background:repeating-linear-gradient(90deg,#5a4a1e 0 1px,transparent 1px 10px) top/100% 11px repeat-x,linear-gradient(#f2d98a,#e0bd5c)}
.sun{position:fixed;inset:0;pointer-events:none;z-index:40;mix-blend-mode:screen;overflow:hidden}
.sun::before{content:"";position:absolute;inset:-20%;background:linear-gradient(115deg,transparent 4%,rgba(255,228,150,.24) 9%,rgba(255,228,150,.24) 22%,transparent 27%,transparent 33%,rgba(255,228,150,.18) 38%,rgba(255,228,150,.18) 52%,transparent 57%);-webkit-mask-image:repeating-linear-gradient(28deg,#000 0 170px,transparent 170px 202px);mask-image:repeating-linear-gradient(28deg,#000 0 170px,transparent 170px 202px);animation:drift 10s ease-in-out infinite}
.sun::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 70% 55% at 0 0,rgba(255,225,140,.4),transparent 70%)}
@keyframes drift{0%,100%{transform:translate(0,0);opacity:.7}50%{transform:translate(28px,16px);opacity:1}}
.dust{position:fixed;inset:0;pointer-events:none;z-index:41;overflow:hidden}
.dust span{position:absolute;border-radius:50%;background:rgba(255,244,200,.9);box-shadow:0 0 6px rgba(255,235,170,.9);opacity:0;animation:mote var(--d) linear infinite}
@keyframes mote{0%{transform:translate(0,0);opacity:0}15%{opacity:.9}85%{opacity:.5}100%{transform:translate(130px,170px);opacity:0}}
</style>
</head>
<body>
<div class="sun"></div><div class="dust" id="dust"></div>
<main>
<h1>📖 Book Cricket</h1>
<p class="sub">No bat, no ball, no ground — just a book and a bit of luck.</p>

<section id="setup" class="card">
  <div class="row">
    <div><label for="n1">Player 1</label><input id="n1" value="Player 1" maxlength="14"></div>
    <div><label for="n2">Player 2</label><input id="n2" value="Player 2" maxlength="14"></div>
  </div>
  <div class="row">
    <div><label for="inn">Innings each</label><select id="inn"><option value="1">1 innings</option><option value="2">2 innings</option></select></div>
    <div><label for="fmt">Format</label><select id="fmt"><option value="0">Until OUT</option><option value="5">5 overs</option><option value="10">10 overs</option></select></div>
  </div>
  <button class="big" id="start">Start match</button>
</section>

<section id="game" class="hide">
  <div class="score">
    <div class="pl" id="c0"><b id="a0"></b><span class="t" id="t0">0</span><small id="h0"></small></div>
    <div class="pl" id="c1"><b id="a1"></b><span class="t" id="t1">0</span><small id="h1"></small></div>
  </div>
  <div class="status" id="status"></div>
  <div class="stage"><div class="book" id="book">
    <div class="pgL"><div class="txt">Open a random page. The last digit decides your fate.</div></div>
    <div class="pgR"><span class="num" id="num">?</span></div>
    <div class="flip"></div><div class="spine"></div>
  </div></div>
  <div id="result"></div>
  <div class="chips" id="chips"></div>
  <button class="big" id="draw">Open a page</button>
  <div class="card" style="margin-top:18px">
    <details><summary>Runs table</summary>
    <table><tr><th>Last digit</th><th>Result</th></tr>
    <tr><td>0</td><td>OUT</td></tr><tr><td>1 or 7</td><td>1 run</td></tr><tr><td>2 or 8</td><td>2 runs</td></tr>
    <tr><td>3 or 9</td><td>3 runs</td></tr><tr><td>4</td><td>4 runs</td></tr><tr><td>5</td><td>5 runs</td></tr><tr><td>6</td><td>6 runs</td></tr></table></details>
  </div>
</section>
<div class="desk"><span class="pen">✏️</span><span class="ruler"></span><span class="app">🍎</span></div>
</main>

<div class="ov hide" id="ov"><div class="box"><h2 id="ovt"></h2><p id="ovp"></p><button class="big" id="again">Play again</button></div></div>

<script>
(function(){
var MAP=[0,1,2,3,4,5,6,1,2,3];
var $=function(i){return document.getElementById(i)};
var S;
function names(){return S.names}
function start(){
  var inn=+$('inn').value, ov=+$('fmt').value;
  S={names:[$('n1').value.trim()||'Player 1',$('n2').value.trim()||'Player 2'],inn:inn,limit:ov?ov*6:Infinity,
     seq:[],i:0,tot:[0,0],cur:0,balls:0,log:[],busy:false,hist:[[],[]],so:false};
  for(var k=0;k<inn;k++){S.seq.push(0);S.seq.push(1)}
  $('setup').classList.add('hide');$('game').classList.remove('hide');
  $('a0').textContent=S.names[0];$('a1').textContent=S.names[1];
  newInnings();
}
function newInnings(){
  S.cur=0;S.balls=0;S.log=[];
  var p=S.seq[S.i];
  $('c0').classList.toggle('on',p===0);$('c1').classList.toggle('on',p===1);
  $('chips').innerHTML='';$('result').textContent='';$('num').textContent='?';
  var n=Math.floor(S.i/2)+1;
  var lab=S.so?'Super Over':(S.inn>1?'Innings '+n+' · ':'');
  $('status').textContent=lab+(S.so?' · ':'')+S.names[p]+' is batting'+(S.limit<Infinity?' · 0/'+S.limit+' balls':' · until OUT');
  $('draw').disabled=false;S.busy=false;render();
}
function render(){
  for(var p=0;p<2;p++){
    var cur=(S.seq[S.i]===p)?S.cur:0;
    $('t'+p).textContent=S.tot[p]+cur;
    $('h'+p).textContent=S.hist[p].length?S.hist[p].join(' + '):'';
  }
}
function draw(){
  if(S.busy)return;S.busy=true;$('draw').disabled=true;
  var book=$('book'),num=$('num');book.classList.add('rolling');$('result').textContent='';
  var iv=setInterval(function(){num.textContent=1+Math.floor(Math.random()*400)},70);
  leaf(book);var lv=setInterval(function(){leaf(book)},170);
  setTimeout(function(){
    clearInterval(iv);clearInterval(lv);book.classList.remove('rolling');
    var page=1+Math.floor(Math.random()*400);num.textContent=page;
    num.classList.remove('pop');void num.offsetWidth;num.classList.add('pop');
    land(page);
  },1000);
}
function land(page){
  var d=page%10,r=MAP[d],p=S.seq[S.i],res=$('result');
  S.balls++;
  var chip=document.createElement('div');chip.className='chip';
  res.className='';void res.offsetWidth;
  if(r===0){
    chip.textContent='W';chip.classList.add('w');
    res.textContent='OUT! 💥';res.style.color='var(--acc)';res.className='shake';
    $('book').classList.remove('flash');void $('book').offsetWidth;$('book').classList.add('flash');
    $('chips').appendChild(chip);
    S.hist[p].push(S.cur+' (out)');S.tot[p]+=S.cur;S.cur=0;
    $('status').textContent=S.names[p]+' is out for '+(S.tot[p]-sumPrev(p))+'.';
    return setTimeout(next,1800);
  }
  S.cur+=r;chip.textContent=r;
  if(r>=6){chip.classList.add('s');burst('🎉',22)}else if(r===4){chip.classList.add('f');burst('✨',12)}
  res.textContent=(r===6?'SIX! ':r===4?'FOUR! ':'')+'+'+r+(r===1?' run':' runs');
  res.style.color=r>=4?'var(--grn)':'var(--ink)';res.classList.add('pop');
  $('chips').appendChild(chip);
  $('status').textContent=S.names[p]+' · page '+page+' → last digit '+d+(S.limit<Infinity?' · '+S.balls+'/'+S.limit+' balls':'');
  render();
  if(S.balls>=S.limit){
    S.hist[p].push(S.cur+'*');S.tot[p]+=S.cur;S.cur=0;
    $('status').textContent='Overs complete for '+S.names[p]+'.';
    return setTimeout(next,1800);
  }
  S.busy=false;$('draw').disabled=false;
}
function sumPrev(p){var s=0;S.hist[p].slice(0,-1).forEach(function(h){s+=parseInt(h,10)});return s}
function next(){
  S.i++;
  if(S.i<S.seq.length)return newInnings();
  finish();
}
function finish(){
  var a=S.tot[0],b=S.tot[1];
  if(a===b){
    S.so=true;S.seq=[0,1];S.i=0;
    $('status').textContent='Tied at '+a+'! Super Over incoming…';
    return setTimeout(newInnings,1800);
  }
  var w=a>b?0:1;
  $('ovt').textContent='🏆 '+S.names[w]+' wins!';
  $('ovp').textContent=S.names[0]+' '+a+' — '+b+' '+S.names[1]+(S.so?' (after Super Over)':'');
  $('ov').classList.remove('hide');burst('🏆',30);burst('🎉',30);
  $('draw').disabled=true;
}
function leaf(b){var l=document.createElement('div');l.className='leaf';l.innerHTML='<i></i><i class="b"></i>';b.appendChild(l);setTimeout(function(){l.remove()},700)}
(function(){var d=$('dust');for(var k=0;k<28;k++){var s=document.createElement('span'),z=1+Math.random()*2.5;s.style.cssText='left:'+(Math.random()*70)+'%;top:'+(Math.random()*60)+'%;width:'+z+'px;height:'+z+'px;animation-delay:-'+(Math.random()*12)+'s';s.style.setProperty('--d',(8+Math.random()*10)+'s');d.appendChild(s)}})();
function burst(e,n){
  for(var k=0;k<n;k++){
    var s=document.createElement('span');s.className='p';s.textContent=e;
    s.style.left='50%';s.style.top='45%';
    s.style.setProperty('--x',(Math.random()*500-250)+'px');
    s.style.setProperty('--y',(Math.random()*-320-40)+'px');
    s.style.setProperty('--r',(Math.random()*720-360)+'deg');
    document.body.appendChild(s);setTimeout(function(x){x.remove()}.bind(null,s),1200);
  }
}
$('start').onclick=start;$('draw').onclick=draw;
$('again').onclick=function(){$('ov').classList.add('hide');$('game').classList.add('hide');$('setup').classList.remove('hide')};
})();
</script>
</body>
</html>
